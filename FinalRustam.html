        window.onload = function() {
            const datalist = document.getElementById('questionsDatalist');
            mdkDatabase.forEach((item) => {
                const option = document.createElement('option');
                option.value = `${item.id}. ${item.question.replace(/^\d+\.\s*/, '')}`;
                datalist.appendChild(option);
            });
        };

        function handleSearch(event) {
            event.preventDefault();

            const rawInput = document.getElementById('searchInput').value.trim();
            if (!rawInput) return;

            const resultCard = document.getElementById('resultCard');

            let foundMatch = null;

            if (/^\d+$/.test(rawInput)) {
                const searchNumber = parseInt(rawInput, 10);
                foundMatch = mdkDatabase.find(item => item.id === searchNumber);
            } else {
                const cleanQuery = rawInput.toLowerCase();
                foundMatch = mdkDatabase.find(item =>
                    item.question.toLowerCase().includes(cleanQuery) ||
                    item.author.toLowerCase().includes(cleanQuery) ||
                    item.topic.toLowerCase().includes(cleanQuery)
                );
            }

            if (foundMatch) {
                document.getElementById('resTopic').innerText = foundMatch.topic;
                document.getElementById('resAuthor').innerText = foundMatch.author;
                document.getElementById('resQuestion').innerText = foundMatch.question;
                document.getElementById('resAnswer').innerHTML = `<p>${foundMatch.answer}</p>`;

                document.getElementById('resSourceText').innerText = foundMatch.sourceName;
                document.getElementById('resSourceLink').href = foundMatch.sourceUrl;
                resultCard.classList.remove('hidden');
            } else {
                resultCard.classList.add('hidden');
                alert("По вашему запросу ничего не найдено.");
            }
        }
    </script>
